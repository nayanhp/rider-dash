<title>Core Game Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: a game picker on top, one full-height play stage below. Deliberately one bright cartoon look in every theme. */
:root{
  color-scheme:light;
  --sky:#4FB3F6; --sky-2:#BDE7FF; --ink:#3A2A12; --ink-2:#6E5531; --card:#F3D9A4; --card-edge:#B98536; --tape:#F7E7C1;
  --green:#5DD039; --green-dark:#3A9A1E; --yellow:#FFCC2E; --yellow-dark:#D99A00; --red:#FF5A4E; --red-dark:#C4302A; --blue:#2F8CFF; --blue-dark:#1A5FC0;
  --star:#FFC800; --star-off:#D8CDB3;
  --display:"Lilita One","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(var(--sky),var(--sky-2));color:var(--ink);font-family:var(--body);font-weight:800;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px));gap:8px}
.top{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{font-family:var(--display);color:#fff;border-radius:16px;padding:10px 12px;font-size:1.05rem;text-shadow:0 2px 0 rgba(0,0,0,.25);position:relative;top:0}
.btn:active:not(:disabled){top:3px}
.top .btn{font-size:.78rem;padding:7px 4px;line-height:1.1;border-radius:12px}
.top .btn span{display:block;font-size:1.1rem}
.b-green{background:var(--green);box-shadow:0 5px 0 var(--green-dark)}
.b-blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-dark)}
.b-red{background:var(--red);box-shadow:0 5px 0 var(--red-dark)}
.b-yellow{background:var(--yellow);color:var(--ink);text-shadow:none;box-shadow:0 5px 0 var(--yellow-dark)}
.b-off{background:#EADBB8;color:var(--ink-2);text-shadow:none;box-shadow:0 5px 0 #C2A874}
.btn:disabled{background:#C9C2B3;box-shadow:0 5px 0 #9C9483;color:#F2EEE6;text-shadow:none}
.stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;z-index:2}
.pill{font-family:var(--display);background:rgba(58,42,18,.82);color:#fff;border-radius:999px;padding:4px 12px;font-size:1rem;white-space:nowrap}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,24,52,.55);padding:14px;z-index:3;overflow-y:auto}
.over[hidden]{display:none!important}
.panel{background:var(--card);border:3px solid var(--card-edge);border-radius:22px;padding:18px 14px 16px;box-shadow:0 6px 0 var(--card-edge);text-align:center;display:grid;gap:10px;max-width:350px;width:100%}
.ribbon{font-family:var(--display);font-size:1.4rem;color:#fff;background:var(--red);border-radius:12px;padding:6px 14px;justify-self:center;box-shadow:0 4px 0 var(--red-dark);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.big{font-family:var(--display);font-size:3.2rem;color:var(--green);text-shadow:0 4px 0 var(--green-dark);line-height:1}
.sub{font-size:.88rem;color:var(--ink-2);line-height:1.4;margin:0}
.how{display:grid;gap:6px;text-align:left;font-size:.86rem;background:var(--tape);border-radius:14px;padding:10px 12px}
.play{font-size:1.35rem;padding:13px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvb{border-radius:16px;padding:8px 4px 6px;display:grid;justify-items:center;gap:1px;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-dark);position:relative;top:0}
.lvb:active:not(:disabled){top:3px}
.lvb.done{background:var(--green);box-shadow:0 5px 0 var(--green-dark)}
.lvb:disabled{background:#C9C2B3;box-shadow:0 5px 0 #9C9483}
.lvb .n{font-family:var(--display);font-size:1.5rem;line-height:1}
.lvb .t{font-size:.62rem;line-height:1.1;min-height:2.2em}
.lvb .s{font-size:.8rem;color:var(--star);letter-spacing:1px}
.lvb .s i{font-style:normal;color:rgba(255,255,255,.45)}
.swrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.lab{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);width:56px;text-align:right}
.bigstars{display:flex;justify-content:center;gap:6px;font-size:3.2rem;line-height:1}
.bigstars span{color:var(--star-off)}
.bigstars span.on{color:var(--star);animation:starpop .45s cubic-bezier(.3,1.6,.5,1) both}
.bigstars span:nth-child(2){font-size:4rem;margin-top:-10px}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.rowb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

#dom{position:absolute;inset:0;background:#E9E2CF;display:flex;flex-direction:column;padding:46px 10px 12px;gap:10px;overflow:hidden}
#dom[hidden]{display:none!important}
/* bag pack */
.ordercard{background:#fff;border-radius:16px;padding:8px 12px;display:grid;gap:6px;box-shadow:0 4px 0 #CFC5B0}
.ordercard .r1{display:flex;justify-content:space-between;font-size:.88rem}
.tbar{height:9px;border-radius:6px;background:#EDE5D3;overflow:hidden}.tbar i{display:block;height:100%}
.bagwrap{display:grid;justify-items:center;gap:6px;padding-top:12px}
.bag{display:grid;gap:3px;background:#8A5A2B;padding:8px;border-radius:10px 10px 22px 22px;box-shadow:0 6px 0 #5E3B18;position:relative}
.bag::before{content:"";position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:76px;height:22px;border:6px solid #5E3B18;border-bottom:0;border-radius:30px 30px 0 0}
.cell{width:var(--cs);height:var(--cs);border-radius:7px;background:#6B4420;box-shadow:inset 0 3px 0 rgba(0,0,0,.25);display:grid;place-items:center;font-size:calc(var(--cs) * .5);padding:0}
.blk{box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 4px 0 rgba(255,255,255,.45)}
.cell.ok{background:rgba(93,208,57,.75)!important}
.cell.bad{background:rgba(255,90,78,.75)!important}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bag.nope{animation:nope .25s}
.fillrow{display:flex;align-items:center;gap:8px;font-size:.78rem;width:100%;max-width:280px}
.fillrow .tbar{flex:1}
.tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:flex-end;min-height:84px;background:#F7E7C1;border-radius:16px;padding:10px}
.piece{display:grid;gap:3px;padding:6px;border-radius:12px;background:#fff;box-shadow:0 4px 0 #CFC5B0;position:relative;top:0;touch-action:none}
.piece.sel{outline:4px solid var(--yellow);top:-4px}
.pc{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:14px}
.ghost{position:fixed;z-index:80;pointer-events:none;display:grid;gap:3px;opacity:.9;transform:translate(-50%,-50%)}
.rowc{display:flex;gap:10px;justify-content:center}
.small{font-size:.95rem;padding:8px 14px}
/* merge */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;flex:1;min-height:0;align-content:center}
.slot{aspect-ratio:1;border-radius:16px;background:#D9CFB8;box-shadow:inset 0 4px 0 rgba(0,0,0,.08);display:grid;place-items:center;position:relative;padding:0}
.slot.v{background:#fff;box-shadow:0 5px 0 #CFC5B0}
.slot.blk2{background:repeating-linear-gradient(45deg,#FFCC2E 0 10px,#3A2A12 10px 20px);box-shadow:0 5px 0 #9C7A00}
.slot.sel{outline:4px solid var(--yellow)}
.slot.match{outline:3px dashed var(--green)}
.slot .e{font-size:2rem;line-height:1}
.slot .lv{position:absolute;top:4px;left:6px;font-family:var(--display);font-size:.75rem;color:var(--blue)}
@keyframes mpop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.slot.new .e{animation:mpop .35s}
.goalcard{background:#fff;border-radius:16px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-size:.9rem;box-shadow:0 4px 0 #CFC5B0;gap:8px}
.goalcard b{font-family:var(--display);font-size:1.1rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <div class="top" role="tablist" aria-label="Choose a game">
    <button class="btn b-green" role="tab" id="tDash" aria-selected="true"><span>🛵</span>Rider Dash</button>
    <button class="btn b-off" role="tab" id="tPack" aria-selected="false"><span>🛍️</span>Bag Pack</button>
    <button class="btn b-off" role="tab" id="tMerge" aria-selected="false"><span>🔀</span>Merge Fleet</button>
    <button class="btn b-off" role="tab" id="tRoute" aria-selected="false"><span>✏️</span>Route Rush</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="dom" hidden></div>
    <div class="hud"><span class="pill" id="h1"></span><span class="pill" id="h2"></span><span class="pill" id="h3"></span></div>
    <div class="over" id="over"></div>
  </div>
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stage = document.getElementById('stage'), over = document.getElementById('over'), domEl = document.getElementById('dom');
let W = 0, H = 0, DPR = 1;
function resize() { const r = stage.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1); W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); if (game && game.onResize) game.onResize(); }
const ls = { get(k, d) { try { const v = localStorage.getItem('cgt-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('cgt-' + k, JSON.stringify(v)); } catch (e) {} } };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function emoji(e, x, y, size) { ctx.font = `${Math.max(1, size)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }
function txt(t, x, y, size, color, stroke) { ctx.font = `${size}px "Lilita One",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; if (stroke) { ctx.lineWidth = 5; ctx.strokeStyle = stroke; ctx.strokeText(t, x, y); } ctx.fillStyle = color; ctx.fillText(t, x, y); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
let fx = [];
function pop(x, y, t, color = '#5DD039') { fx.push({ kind: 't', x, y, t, color, life: 1 }); }
function burst(x, y, color, n = 10) { if (reduce) return; for (let i = 0; i < n; i++) fx.push({ kind: 'p', x, y, vx: rnd(-140, 140), vy: rnd(-200, -40), color, life: rnd(.4, .8) }); }
function drawFx(dt) {
  fx = fx.filter((f) => (f.life -= dt) > 0);
  for (const f of fx) {
    if (f.kind === 't') { f.y -= 44 * dt; ctx.globalAlpha = Math.min(1, f.life * 1.5); txt(f.t, f.x, f.y, 22, f.color, '#fff'); }
    else { f.vy += 420 * dt; f.x += f.vx * dt; f.y += f.vy * dt; ctx.globalAlpha = Math.min(1, f.life * 2); ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(f.x, f.y, 4.5, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function hud(a, b, c) { document.getElementById('h1').textContent = a; document.getElementById('h2').textContent = b; document.getElementById('h3').textContent = c; }
function domPop(text, color = '#3A9A1E') { const el = document.createElement('div'); el.className = 'pill'; el.style.cssText = `position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:4;font-size:1.2rem;background:${color};pointer-events:none`; el.textContent = text; stage.appendChild(el); setTimeout(() => el.remove(), 900); }
const starsHtml = (n) => `<div class="bigstars">${[0, 1, 2].map((i) => `<span class="${i < n ? 'on' : ''}" style="animation-delay:${i * .25}s">★</span>`).join('')}</div>`;
function levelGrid(levels, prog, extra = '') {
  return `<div class="lvls">${levels.map((l, i) => { const st = prog[i] || 0; const open = i === 0 || (prog[i - 1] || 0) > 0;
    return `<button class="lvb ${st ? 'done' : ''}" data-lv="${i}" ${open ? '' : 'disabled'}><span class="n">${open ? i + 1 : '🔒'}</span><span class="t">${l.name}</span><span class="s">${'★'.repeat(st)}<i>${'★'.repeat(3 - st)}</i></span></button>`; }).join('')}${extra}</div>`;
}

/* =================== RIDER DASH (pseudo-3D runner) =================== */
const AV_JACKET = ['#FF5A4E', '#2F8CFF', '#5DD039', '#8E44FF', '#FF9F1A', '#2A2F5A'];
const AV_HELMET = ['#FFCC2E', '#FFFFFF', '#FF5A4E', '#2A2F5A', '#5DD039', '#FF7AC6'];
const AV_SKIN = ['#F6D2B2', '#E3AC7E', '#C68642', '#8D5524', '#5C3A21'];
const RD_ALL = ['auto', 'car', 'hole', 'bump', 'cow'];
const RD_LEVELS = [
  { name: 'First delivery', tip: 'Tap left or right of your rider to change lanes. Grab a 📦, then ride through a green DROP zone.', goal: 2, v0: 260, v1: 360, dens: .15, kinds: ['auto'] },
  { name: 'Morning rush', tip: 'More autos and cars on the road. Keep your parcels safe.', goal: 3, v0: 290, v1: 400, dens: .3, kinds: ['auto', 'car'] },
  { name: 'Pothole street', tip: 'Swipe up (or press ⬆) to jump over potholes and speed breakers.', goal: 4, v0: 310, v1: 430, dens: .35, kinds: ['auto', 'car', 'hole', 'bump'] },
  { name: 'Cow crossing', tip: "Cows can't be jumped. Change lanes!", goal: 5, v0: 330, v1: 470, dens: .42, kinds: RD_ALL },
  { name: 'Monsoon evening', tip: 'Rain slows your lane changes. Move early.', goal: 6, v0: 340, v1: 500, dens: .48, kinds: RD_ALL, rain: true },
  { name: 'Midnight cravings', tip: 'Night shift. The fastest run in Koramangala.', goal: 8, v0: 360, v1: 540, dens: .55, kinds: RD_ALL, night: true },
];
const RD_ENDLESS = { name: 'Endless', endless: true, tip: 'How far can you go? It never stops getting faster.', v0: 300, v1: 800, dens: .5, kinds: RD_ALL, ramp: 90 };
const RiderDash = {
  key: 'dash', title: 'Rider Dash',
  av() { return ls.get('av', { j: 0, h: 0, s: 1 }); },
  menu(done) {
    const prog = ls.get('rd', {}), a = this.av();
    over.innerHTML = `<div class="panel"><div class="ribbon">Rider Dash</div>
      <div class="swrow"><span class="lab">Jacket</span>${AV_JACKET.map((c, i) => `<button class="sw" style="background:${c}" data-k="j" data-v="${i}" aria-pressed="${a.j === i}" aria-label="Jacket ${i + 1}"></button>`).join('')}</div>
      <div class="swrow"><span class="lab">Helmet</span>${AV_HELMET.map((c, i) => `<button class="sw" style="background:${c}" data-k="h" data-v="${i}" aria-pressed="${a.h === i}" aria-label="Helmet ${i + 1}"></button>`).join('')}</div>
      <div class="swrow"><span class="lab">Skin</span>${AV_SKIN.map((c, i) => `<button class="sw" style="background:${c}" data-k="s" data-v="${i}" aria-pressed="${a.s === i}" aria-label="Skin ${i + 1}"></button>`).join('')}</div>
      ${levelGrid(RD_LEVELS, prog)}
      <button class="btn b-red" id="endless">♾ Endless · best ${ls.get('rd-best', 0)}</button></div>`;
    over.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => { const v = this.av(); v[b.dataset.k] = +b.dataset.v; ls.set('av', v); this.menu(done); this.preview(); });
    over.querySelectorAll('[data-lv]').forEach((b) => b.onclick = () => this.brief(+b.dataset.lv, done));
    document.getElementById('endless').onclick = () => done({ lvl: -1 });
    this.preview();
  },
  brief(i, done) {
    const L = RD_LEVELS[i];
    over.innerHTML = `<div class="panel"><div class="ribbon">Level ${i + 1}: ${L.name}</div><p class="sub" style="font-size:1rem"><b>Deliver ${L.goal} parcels</b></p><div class="how">${L.tip}</div><p class="sub">Lose all 3 hearts and the level ends. Finish with more hearts for more stars.</p>
      <div class="rowb"><button class="btn b-yellow" id="bk">◀ Levels</button><button class="btn b-green play" id="go">▶ Ride</button></div></div>`;
    document.getElementById('bk').onclick = () => this.menu(done); document.getElementById('go').onclick = () => done({ lvl: i });
  },
  preview() { this.start({ lvl: 0 }); this.t = 0; ctx.clearRect(0, 0, W, H); this.render(); },
  start(o) {
    this.lvl = o.lvl; this.L = o.lvl >= 0 ? RD_LEVELS[o.lvl] : RD_ENDLESS;
    Object.assign(this, { t: 0, z: 0, hearts: 3, carry: 0, delivered: 0, coins: 0, combo: 0, lane: 1, lx: 1, objs: [], nextRow: 900, rows: 0, inv: 0, jump: 0, lean: 0, rain: [], won: false });
  },
  geo() { const y0 = H * .3, yP = H - Math.max(70, H * .14), LW = W * .27; return { y0, yP, LW, D: 340 }; },
  proj(z, lane) { const g = this.geo(); const s = g.D / (z + g.D); return { x: W / 2 + (lane - 1) * g.LW * s, y: g.y0 + (g.yP - g.y0) * s, s }; },
  speed() { const L = this.L; return L.v0 + (L.v1 - L.v0) * Math.min(1, this.t / (L.ramp || 45)); },
  spawnRow(zz) {
    const L = this.L; this.rows++; const lanes = [0, 1, 2].sort(() => Math.random() - .5);
    if (this.carry > 0 && this.rows % 5 === 0) { this.objs.push({ k: 'drop', lane: lanes[0], z: zz }); return; }
    const two = Math.random() < L.dens; const n = two ? 2 : 1;
    for (let i = 0; i < n; i++) this.objs.push({ k: pick(L.kinds), lane: lanes[i], z: zz + (i ? rnd(-60, 60) : 0) });
    const free = lanes[2];
    if (Math.random() < .55 && this.carry < 3) this.objs.push({ k: 'parcel', lane: free, z: zz + 160 });
    else for (let c = 0; c < 4; c++) this.objs.push({ k: 'coin', lane: free, z: zz + 80 + c * 60 });
  },
  swipeStart(p) { this.sx = p.x; this.sy = p.y; this.swiped = false; },
  swipeMove(p) {
    if (this.sx == null || this.swiped) return; const dx = p.x - this.sx, dy = p.y - this.sy;
    if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) { this.shift(dx > 0 ? 1 : -1); this.swiped = true; }
    else if (dy < -28 && Math.abs(dy) > Math.abs(dx)) { this.hop(); this.swiped = true; }
  },
  swipeEnd(p) { if (this.sx != null && !this.swiped) { const me = this.proj(0, this.lx).x; this.shift(p.x > me ? 1 : -1); } this.sx = null; },
  shift(d) { this.lane = Math.max(0, Math.min(2, this.lane + d)); },
  hop() { if (this.jump <= 0) this.jump = .62; },
  key(e) { if (e.key === 'ArrowLeft') this.shift(-1); if (e.key === 'ArrowRight') this.shift(1); if (e.key === 'ArrowUp' || e.key === ' ') this.hop(); },
  update(dt) {
    const L = this.L; this.t += dt; const v = this.speed(); this.z += v * dt;
    const follow = L.rain ? 7 : 14; const old = this.lx; this.lx += (this.lane - this.lx) * Math.min(1, dt * follow); this.lean = (this.lx - old) / Math.max(dt, .001) * .05;
    this.jump = Math.max(0, this.jump - dt); this.inv = Math.max(0, this.inv - dt);
    this.objs.forEach((o) => { o.z -= v * dt; });
    if (this.z >= this.nextRow) { this.spawnRow(2300); this.nextRow = this.z + Math.max(330, 620 - this.t * 3); }
    const air = this.jump > .08 && this.jump < .54; const myLane = Math.round(this.lx); const g = this.geo();
    for (const o of this.objs) {
      if (o.done || o.z > 34 || o.z < -34 || o.lane !== myLane) continue;
      const sx = W / 2, py = g.yP - 120;
      if (o.k === 'coin') { o.done = true; this.coins++; if (!reduce) burst(this.proj(0, this.lx).x, py + 40, '#FFCC2E', 4); }

function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

cv.addEventListener('pointermove', (e) => { if (!running || game.dom) return; const p = pt(e); if (game === RiderDash) game.swipeMove(p); else game.move(p); });
cv.addEventListener('pointerup', (e) => { if (!running || game.dom) return; const p = pt(e); if (game === RiderDash) game.swipeEnd(p); else game.up(p); });

}
document.addEventListener('visibilitychange', () => { if (document.hidden && running) { running = false; over.hidden = false; over.innerHTML = `<div class="panel"><div class="ribbon">Paused</div><button class="btn b-green play" id="res">▶ Resume</button></div>`; document.getElementById('res').onclick = () => { over.hidden = true; running = true; last = performance.now(); requestAnimationFrame(loop); }; } });
window.addEventListener('resize', resize);
resize(); select(RiderDash);
</script>
